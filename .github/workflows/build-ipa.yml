name: Build IPA (unsigned, für AltStore/Sideloadly)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode auswählen
        run: ls /Applications | grep -i xcode; X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); echo "Nutze $X"; sudo xcode-select -s "$X"; xcodebuild -version

      - name: Bauen (ohne Signierung)
        run: |
          xcodebuild -project OsmNav.xcodeproj -scheme OsmNav \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -n 60
          test -d build/Build/Products/Release-iphoneos/OsmNav.app

      - name: IPA packen
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OsmNav.app Payload/
          zip -qry LumoGo.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LumoGo-ipa
          path: LumoGo.ipa
